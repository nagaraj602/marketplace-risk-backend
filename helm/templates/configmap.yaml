apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.backend.name }}-config
  labels:
    app: {{ .Values.backend.name }}
data:
  SERVER_PORT: {{ .Values.backend.env.SERVER_PORT | quote }}
  DB_HOST: {{ .Values.backend.env.DB_HOST | quote }}
  DB_PORT: {{ .Values.backend.env.DB_PORT | quote }}
  DB_NAME: {{ .Values.backend.env.DB_NAME | quote }}
  MODEL_SERVER_URL: {{ .Values.backend.env.MODEL_SERVER_URL | quote }}
  AUTO_ENFORCE_THRESHOLD: {{ .Values.backend.env.AUTO_ENFORCE_THRESHOLD | quote }}
  ANALYST_REVIEW_THRESHOLD: {{ .Values.backend.env.ANALYST_REVIEW_THRESHOLD | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.name }}-secret
  labels:
    app: {{ .Values.backend.name }}
type: Opaque
data:
  DB_USERNAME: {{ .Values.backend.secret.DB_USERNAME }}
  DB_PASSWORD: {{ .Values.backend.secret.DB_PASSWORD }}
---
{{- if .Values.backend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.backend.name }}
  labels:
    app: {{ .Values.backend.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.backend.name }}
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
