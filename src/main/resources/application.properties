server.port=${SERVER_PORT:8080}
spring.application.name=marketplace-risk-backend

# Database Configuration (PostgreSQL with embedded H2 fallback for standalone dev)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace_risk}}
spring.datasource.username=${DB_USERNAME:riskuser}
spring.datasource.password=${DB_PASSWORD:riskpass123}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Anomaly Scoring ML Service Connection
risk.model.url=${MODEL_SERVER_URL:http://localhost:5000}
risk.model.timeout-ms=${MODEL_TIMEOUT_MS:3000}

# Risk Decision Thresholds
risk.threshold.auto-enforce=${AUTO_ENFORCE_THRESHOLD:85.0}
risk.threshold.analyst-review=${ANALYST_REVIEW_THRESHOLD:50.0}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.marketplacerisk=INFO
logging.level.org.springframework.web=INFO
